<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Trainingslog</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="theme-color" content="#15181C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --iron:#15181C; --plate:#1F242B; --plate-2:#2A3138;
    --chalk:#E9EDF0; --muted:#7C8894; --signal:#F2C200;
    --done:#3DD68C; --hart:#E8863C; --line:#39424C;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--iron)}
  body{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    color:var(--chalk);
    max-width:520px;margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 14px) 12px calc(env(safe-area-inset-bottom) + 40px);
  }
  .cond{font-family:'Barlow Condensed','Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.04em}

  .top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
  .top h1{font-family:'Barlow Condensed','Arial Narrow',sans-serif;text-transform:uppercase;
    font-size:30px;font-weight:700;letter-spacing:.06em;margin:0;line-height:1}
  .datum{font-size:12px;color:var(--muted)}

  .switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .switch button{font-family:'Barlow Condensed','Arial Narrow',sans-serif;text-transform:uppercase;
    letter-spacing:.08em;font-size:20px;font-weight:700;padding:14px 0;border:2px solid var(--line);
    background:var(--plate);color:var(--muted);border-radius:10px;cursor:pointer}
  .switch button.on{background:var(--signal);color:#15181C;border-color:var(--signal)}

  .wochenzeile{display:flex;align-items:center;gap:8px;background:var(--plate);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px}
  .wochenzeile .lbl{font-size:11px;color:var(--muted);letter-spacing:.08em}
  .wochenzeile .var{font-size:13px;font-weight:600;line-height:1.35}
  .wbtn{width:38px;height:38px;flex:none;border:1px solid var(--line);background:var(--plate-2);
    color:var(--chalk);border-radius:8px;font-size:17px;cursor:pointer}

  .karte{background:var(--plate);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .karte.fertig{border-color:var(--done)}
  .karte.warn{border-color:var(--hart)}
  .kopf{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
  .name{font-family:'Barlow Condensed','Arial Narrow',sans-serif;text-transform:uppercase;
    font-size:19px;font-weight:600;letter-spacing:.04em;line-height:1.1}
  .schema{font-size:11px;color:var(--muted);white-space:nowrap}

  .zeile{display:flex;align-items:center;gap:10px}
  .step{width:52px;height:52px;flex:none;border:none;border-radius:10px;background:var(--plate-2);
    color:var(--chalk);font-size:26px;font-weight:600;cursor:pointer;font-family:'IBM Plex Mono',monospace}
  .step:active{background:var(--signal);color:#15181C}
  .wert{flex:1;text-align:center;min-width:0}
  .wert .zahl{font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .wert .einheit{font-size:11px;color:var(--muted);margin-left:3px}
  .letzte{display:block;font-size:11px;color:var(--muted);margin-top:3px;min-height:14px;line-height:1.3}
  .letzte.up{color:var(--done)}
  .letzte.halten{color:var(--hart)}

  .saetze{display:flex;gap:8px;margin-top:11px}
  .satz{flex:1;height:46px;border:2px solid var(--line);background:transparent;border-radius:9px;
    color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;font-family:'IBM Plex Mono',monospace}
  .satz.ok{background:var(--done);border-color:var(--done);color:#15181C}
  .satz.hart{background:var(--hart);border-color:var(--hart);color:#15181C}
  .legende{font-size:10px;color:var(--muted);margin-top:7px;letter-spacing:.03em}

  .speichern{position:sticky;bottom:calc(env(safe-area-inset-bottom) + 10px);width:100%;padding:18px 0;
    margin-top:16px;border:none;border-radius:12px;background:var(--signal);color:#15181C;cursor:pointer;
    font-family:'Barlow Condensed','Arial Narrow',sans-serif;text-transform:uppercase;
    font-size:22px;font-weight:700;letter-spacing:.08em;box-shadow:0 6px 20px rgba(0,0,0,.5)}
  .speichern.ok{background:var(--done)}

  details{margin-top:20px;border-top:1px solid var(--line);padding-top:12px}
  summary{font-size:12px;color:var(--muted);letter-spacing:.06em;cursor:pointer;list-style:none}
  summary::-webkit-details-marker{display:none}
  .eintrag{border-top:1px solid var(--line);padding:9px 0;font-size:12px}
  .eintrag b{font-family:'Barlow Condensed',sans-serif;font-size:15px;letter-spacing:.05em}
  .eintrag span{color:var(--muted)}
  .werkzeug{display:flex;gap:8px;margin-top:12px}
  .werkzeug button{flex:1;padding:11px 0;border:1px solid var(--line);background:var(--plate);
    color:var(--muted);border-radius:9px;font-size:11px;font-family:'IBM Plex Mono',monospace;cursor:pointer}
  .hinweis{font-size:11px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.5}
</style>
</head>
<body>

<div class="top">
  <h1 id="titel">Training</h1>
  <div class="datum" id="datum"></div>
</div>

<div class="switch">
  <button id="btnA" onclick="planWaehlen('A')">Plan A</button>
  <button id="btnB" onclick="planWaehlen('B')">Plan B</button>
</div>

<div class="wochenzeile">
  <button class="wbtn" onclick="wocheAendern(-1)">&minus;</button>
  <div style="flex:1">
    <div class="lbl cond" id="wochelabel">WOCHE 1 &middot; KLIMMZÜGE</div>
    <div class="var" id="variante">&mdash;</div>
  </div>
  <button class="wbtn" onclick="wocheAendern(1)">+</button>
</div>

<div id="uebungen"></div>

<button class="speichern" id="speicherbtn" onclick="speichern()">Training speichern</button>

<details>
  <summary>▸ Letzte Trainings</summary>
  <div id="verlauf"></div>
  <div class="werkzeug">
    <button onclick="sichern()">Daten kopieren</button>
    <button onclick="wiederherstellen()">Daten einfügen</button>
  </div>
</details>

<div class="hinweis">
  Aufwärmen: 8 Min Rudergerät &middot; Satzpause 90 Sek<br>
  Satzfeld tippen: 1× sauber &middot; 2× unsauber &middot; 3× zurücksetzen
</div>

<script>
const PLAENE = {
  A: [
    {id:'klimm',  name:'Klimmzüge',          schema:'Rotation',       wert:24, step:1,   einheit:'Wdh ges.',    saetze:1},
    {id:'bank',   name:'Bankdrücken',        schema:'3 × 8',          wert:30, step:2.5, einheit:'kg + Stange', saetze:3},
    {id:'presse', name:'Beinpresse',         schema:'3 × 12',         wert:81, step:5,   einheit:'kg', saetze:3},
    {id:'beuger', name:'Beinbeuger',         schema:'3 × 12',         wert:32, step:4,   einheit:'kg', saetze:3},
    {id:'abd',    name:'Abduktor',           schema:'3 × 12',         wert:45, step:4,   einheit:'kg', saetze:3},
    {id:'crunch', name:'Crunchmaschine',     schema:'3 × 12',         wert:27, step:4,   einheit:'kg', saetze:3}
  ],
  B: [
    {id:'klimmB', name:'Klimmzüge leicht',   schema:'Rotation',        wert:20, step:1, einheit:'Wdh ges.', saetze:1},
    {id:'rudern', name:'KH-Rudern einarmig', schema:'3 × 12 je Seite', wert:14, step:2, einheit:'kg', saetze:3},
    {id:'schult', name:'Schulterdrücken KH', schema:'3 × 10',          wert:9,  step:1, einheit:'kg', saetze:3},
    {id:'streck', name:'Beinstrecker',       schema:'3 × 12',          wert:36, step:4, einheit:'kg', saetze:3},
    {id:'add',    name:'Adduktor',           schema:'3 × 12',          wert:45, step:4, einheit:'kg', saetze:3},
    {id:'bizeps', name:'Bizepscurls KH',     schema:'3 × 10–12',       wert:10, step:2, einheit:'kg', saetze:3}
  ]
};

const ROTATION = {
  1:{A:'Pyramide 1-7 / 7-1, eng gegriffen',      B:'3 × 8 weit, locker'},
  2:{A:'5 × 5 schwer, ggf. Zusatzgewicht',       B:'3 × 10 locker'},
  3:{A:'EMOM 10 Min · 3 Klimmzüge pro Minute',   B:'3 × 8 ruhig'},
  4:{A:'Max-Test — so viele wie möglich, sauber',B:'3 × Negativwdh., 5 Sek. runter'}
};

const SCHLUESSEL = 'trainingslog-v1';
let plan='A', woche=1, letzte={}, verlauf=[], aktuell={};

function laden(){
  try{
    const s = JSON.parse(localStorage.getItem(SCHLUESSEL));
    if(s){ letzte=s.letzte||{}; verlauf=s.verlauf||[]; woche=s.woche||1; plan=s.naechsterPlan||'A'; }
  }catch(e){}
  planWaehlen(plan);
  verlaufZeichnen();
}

function altwert(id){
  const l = letzte[id];
  if(l === undefined) return null;
  return (typeof l === 'object') ? l : {wert:l, sauber:true};
}

function planWaehlen(p){
  plan=p; aktuell={};
  btnA.classList.toggle('on', p==='A');
  btnB.classList.toggle('on', p==='B');
  titel.textContent = 'Plan ' + p;
  datum.textContent = new Date().toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'});
  PLAENE[p].forEach(u=>{
    const a = altwert(u.id);
    aktuell[u.id] = { wert: a ? a.wert : u.wert, status: new Array(u.saetze).fill(0) };
  });
  zeichnen();
}

function wocheAendern(d){ woche = ((woche-1+d+4)%4)+1; zeichnen(); }

function zeichnen(){
  wochelabel.textContent = 'WOCHE ' + woche + ' · KLIMMZÜGE';
  variante.textContent = ROTATION[woche][plan];

  uebungen.innerHTML = PLAENE[plan].map(u=>{
    const a = aktuell[u.id], alt = altwert(u.id);
    const alleFertig = a.status.every(s=>s>0);
    const hatHart = a.status.some(s=>s===2);

    let info = '<span class="letzte"></span>';
    if(alt){
      if(!alt.sauber)            info = '<span class="letzte halten">letztes Mal '+fmt(alt.wert)+' — unsauber, Gewicht halten</span>';
      else if(a.wert > alt.wert) info = '<span class="letzte up">letztes Mal '+fmt(alt.wert)+' ▲ +'+fmt(a.wert-alt.wert)+'</span>';
      else                       info = '<span class="letzte">letztes Mal '+fmt(alt.wert)+' — sauber</span>';
    }

    const beschriftung = ['Satz','✓ sauber','⚠ unsauber'], klassen = ['','ok','hart'];
    const saetze = a.status.map((s,i)=>
      '<button class="satz '+klassen[s]+'" onclick="satz(\''+u.id+'\','+i+')">'+
      (s===0 ? 'Satz '+(i+1) : beschriftung[s])+'</button>').join('');

    return '<div class="karte '+(hatHart?'warn':(alleFertig?'fertig':''))+'">'+
      '<div class="kopf"><div class="name">'+u.name+'</div><div class="schema">'+u.schema+'</div></div>'+
      '<div class="zeile">'+
        '<button class="step" onclick="wert(\''+u.id+'\',-'+u.step+')">&minus;</button>'+
        '<div class="wert"><div class="zahl">'+fmt(a.wert)+'<span class="einheit">'+u.einheit+'</span></div>'+info+'</div>'+
        '<button class="step" onclick="wert(\''+u.id+'\','+u.step+')">+</button>'+
      '</div>'+
      '<div class="saetze">'+saetze+'</div>'+
      (hatHart ? '<div class="legende">Nächstes Mal gleiches Gewicht — erst sauber schaffen, dann steigern.</div>' : '')+
    '</div>';
  }).join('');
}

function fmt(n){ return Number(n).toString().replace('.',','); }
function wert(id,d){ aktuell[id].wert = Math.max(0, Math.round((aktuell[id].wert+d)*10)/10); zeichnen(); }
function satz(id,i){ const st=aktuell[id].status; st[i]=(st[i]+1)%3; zeichnen(); }

function speichern(){
  verlauf.unshift({
    datum:new Date().toISOString().slice(0,10), plan, woche,
    uebungen:PLAENE[plan].map(u=>({
      name:u.name, wert:aktuell[u.id].wert, einheit:u.einheit,
      geschafft:aktuell[u.id].status.filter(s=>s>0).length,
      sauber:!aktuell[u.id].status.some(s=>s===2)
    }))
  });
  verlauf = verlauf.slice(0,50);
  PLAENE[plan].forEach(u=>{
    letzte[u.id] = { wert:aktuell[u.id].wert, sauber:!aktuell[u.id].status.some(s=>s===2) };
  });

  const naechsterPlan = plan==='A' ? 'B' : 'A';
  const naechsteWoche = plan==='B' ? (woche%4)+1 : woche;

  try{
    localStorage.setItem(SCHLUESSEL, JSON.stringify({letzte, verlauf, woche:naechsteWoche, naechsterPlan}));
    speicherbtn.textContent='✓ Gespeichert'; speicherbtn.classList.add('ok');
    setTimeout(()=>{ speicherbtn.textContent='Training speichern'; speicherbtn.classList.remove('ok'); },2000);
  }catch(e){ speicherbtn.textContent='Speichern fehlgeschlagen'; }

  woche = naechsteWoche;
  verlaufZeichnen();
  planWaehlen(naechsterPlan);
}

function verlaufZeichnen(){
  const ziel = document.getElementById('verlauf');
  if(!verlauf.length){
    ziel.innerHTML='<div class="eintrag"><span>Noch nichts gespeichert. Das erste Training erscheint hier.</span></div>';
    return;
  }
  ziel.innerHTML = verlauf.slice(0,10).map(e=>{
    const d = e.datum.split('-').reverse().slice(0,2).join('.');
    const z = e.uebungen.map(u=>u.name.split(' ')[0]+' '+fmt(u.wert)+(u.sauber?'':' ⚠')).join(' · ');
    return '<div class="eintrag"><b>'+d+' · PLAN '+e.plan+' · WOCHE '+e.woche+'</b><br><span>'+z+'</span></div>';
  }).join('');
}

function sichern(){
  const daten = localStorage.getItem(SCHLUESSEL) || '{}';
  navigator.clipboard.writeText(daten)
    .then(()=>alert('Daten in die Zwischenablage kopiert. In eine Notiz einfügen — das ist deine Sicherung.'))
    .catch(()=>prompt('Diesen Text kopieren und in einer Notiz sichern:', daten));
}

function wiederherstellen(){
  const t = prompt('Gesicherte Daten hier einfügen:');
  if(!t) return;
  try{
    JSON.parse(t);
    localStorage.setItem(SCHLUESSEL, t);
    location.reload();
  }catch(e){ alert('Das war kein gültiger Sicherungstext.'); }
}

laden();
</script>
</body>
</html>
